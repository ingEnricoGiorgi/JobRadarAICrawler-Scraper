[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobradar-ai-crawler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "SQLAlchemy>=2.0,<3", "openpyxl>=3.1,<4", "truststore>=0.10"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
jobradar = "jobradar.gui:main"

[tool.setuptools.package-data]
jobradar = ["data/*.csv", "data/*.json", "data/*.md"]

[tool.setuptools.packages.find]
include = ["jobradar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
